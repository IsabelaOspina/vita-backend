server.port=${PORT:8080}

# DATABASE_URL ejemplo: jdbc:mysql://host:3306/vita?createDatabaseIfNotExist=true&serverTimezone=America/Bogota
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

vita.jwt.secret=${JWT_SECRET}
vita.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

vita.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Administrador del sistema (opcional: si no se definen, no se crea)
vita.admin.correo=${ADMIN_CORREO:}
vita.admin.contrasena=${ADMIN_CONTRASENA:}
vita.admin.nombre=${ADMIN_NOMBRE:Administrador VITA}
vita.admin.cedula=${ADMIN_CEDULA:0000000000}

# Correo (recuperación de contraseña).
vita.correo.habilitado=${CORREO_HABILITADO:false}
vita.correo.remitente=${CORREO_REMITENTE:adminvita23@gmail.com}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:adminvita23@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true