spring.application.name=vita-backend
spring.profiles.active=dev

# JWT
vita.jwt.secret=${JWT_SECRET}
vita.jwt.expiration-ms=${JWT_EXPIRATION:900000}

# CORS (Expo web; en Expo Go no se envía Origin)
vita.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Configuración de Inalambria Express
inalambria.api-key=${INALAMBRIA_API_KEY:}